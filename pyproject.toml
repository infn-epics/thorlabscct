[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thorlabscct10-ioc"
version = "0.1.0"
description = "EPICS Channel Access IOC for Thorlabs CCT compact spectrometers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "caproto>=1.1.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
hardware = ["pythonnet>=3.0"]
test = ["pytest>=7"]

[project.scripts]
thorlabscct10-ioc = "thorlabscct10_ioc.ioc:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
